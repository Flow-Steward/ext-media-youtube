components:
- component_id: steps_comments_and_captions
  type: markdown
  title: Comments and captions
  body: |
    ### Get comment threads

    Reads top-level comments with their first replies, of a video or a channel, or by ID. Calls youtube.commentThreads.list (GET /youtube/v3/commentThreads) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube.force-ssl.

    Action id `get_comment_threads` · reads only · YouTube: `GET /youtube/v3/commentThreads`

    Inputs: `all_threads_related_to_channel_id`, `video_id`, `channel_id`, `order`, `search_terms`, `id`, `max_results`, `part` (required), `moderation_status`, `text_format`, `page_token`, `all_pages`, `max_items`, `skip`.

    ### Create comment thread

    Posts a new top-level comment. Calls youtube.commentThreads.insert (POST /youtube/v3/commentThreads) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube.force-ssl.

    Action id `create_comment_thread` · changes data in YouTube · YouTube: `POST /youtube/v3/commentThreads`

    Inputs: `part` (required), `body` (required).

    ### Get comments

    Reads comments by ID, or the replies to a comment. Calls youtube.comments.list (GET /youtube/v3/comments) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube.force-ssl.

    Action id `get_comments` · reads only · YouTube: `GET /youtube/v3/comments`

    Inputs: `part` (required), `parent_id`, `page_token`, `max_results`, `id`, `text_format`, `all_pages`, `max_items`, `skip`.

    ### Create comment reply

    Posts a reply to an existing comment. Calls youtube.comments.insert (POST /youtube/v3/comments) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube.force-ssl.

    Action id `create_comment_reply` · changes data in YouTube · YouTube: `POST /youtube/v3/comments`

    Inputs: `part` (required), `body` (required).

    ### Mark comments as spam

    Flags comments as spam. YouTube: Expresses the caller's opinion that one or more comments should be flagged as spam. Calls youtube.comments.markAsSpam (POST /youtube/v3/comments/markAsSpam) of the YouTube Data API. The YouTube quota table gives no cost for it. Google scopes: youtube.force-ssl.

    Action id `mark_comments_as_spam` · changes data in YouTube · YouTube: `POST /youtube/v3/comments/markAsSpam`

    Inputs: `id` (required).

    ### Set comment moderation status

    Publishes, holds for review or rejects comments, optionally banning the author. YouTube: Sets the moderation status of one or more comments. Calls youtube.comments.setModerationStatus (POST /youtube/v3/comments/setModerationStatus) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube.force-ssl.

    Action id `set_comment_moderation_status` · changes data in YouTube · YouTube: `POST /youtube/v3/comments/setModerationStatus`

    Inputs: `moderation_status` (required), `id` (required), `ban_author`.

    ### Update comment

    Changes the text of a comment. Calls youtube.comments.update (PUT /youtube/v3/comments) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube.force-ssl.

    Action id `update_comment` · changes data in YouTube · YouTube: `PUT /youtube/v3/comments`

    Inputs: `part` (required), `body` (required).

    ### Delete comment

    Deletes a comment. Calls youtube.comments.delete (DELETE /youtube/v3/comments) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube.force-ssl.

    Action id `delete_comment` · changes data in YouTube · YouTube: `DELETE /youtube/v3/comments`

    Inputs: `id` (required).

    ### Get caption tracks

    Reads the caption tracks of a video. Calls youtube.captions.list (GET /youtube/v3/captions) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube.force-ssl, youtubepartner.

    Action id `get_caption_tracks` · reads only · YouTube: `GET /youtube/v3/captions`

    Inputs: `part` (required), `on_behalf_of_content_owner`, `id`, `on_behalf_of`, `video_id` (required).

    ### Download caption track

    Saves a caption track as a workflow file, optionally converted or translated. YouTube: Downloads a caption track. Calls youtube.captions.download (GET /youtube/v3/captions/{id}) of the YouTube Data API. The YouTube quota table gives no cost for it. YouTube's file is saved as a workflow file. Google scopes: youtube.force-ssl, youtubepartner.

    Action id `download_caption_track` · reads only · YouTube: `GET /youtube/v3/captions/{id}`

    Inputs: `id` (required), `on_behalf_of_content_owner`, `tlang`, `on_behalf_of`, `tfmt`.

    ### Upload caption track

    Uploads a caption track from a workflow file with its metadata in body. Calls youtube.captions.insert (POST /youtube/v3/captions) of the YouTube Data API. Quota cost: 400 units per call. The workflow file in file (required) is sent by YouTube's resumable upload, up to 100 MiB here (YouTube: 100 MiB). Google scopes: youtube.force-ssl, youtubepartner.

    Action id `upload_caption_track` · changes data in YouTube · YouTube: `POST /youtube/v3/captions`

    Inputs: `on_behalf_of`, `on_behalf_of_content_owner`, `part` (required), `sync`, `body`, `file` (required), `content_type`.

    ### Update caption track

    Changes a caption track's draft status, optionally with a new caption file. Calls youtube.captions.update (PUT /youtube/v3/captions) of the YouTube Data API. Quota cost: 450 units per call. The workflow file in file (optional) is sent by YouTube's resumable upload, up to 100 MiB here (YouTube: 100 MiB). Google scopes: youtube.force-ssl, youtubepartner.

    Action id `update_caption_track` · changes data in YouTube · YouTube: `PUT /youtube/v3/captions`

    Inputs: `part` (required), `sync`, `on_behalf_of_content_owner`, `on_behalf_of`, `body`, `file`, `content_type`.

    ### Delete caption track

    Deletes a caption track. Calls youtube.captions.delete (DELETE /youtube/v3/captions) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube.force-ssl, youtubepartner.

    Action id `delete_caption_track` · changes data in YouTube · YouTube: `DELETE /youtube/v3/captions`

    Inputs: `id` (required), `on_behalf_of`, `on_behalf_of_content_owner`.
