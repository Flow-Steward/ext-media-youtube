title: 'YouTube API: Playlists'
description: The 12 playlists steps.
components:
- component_id: steps_playlists
  type: markdown
  title: Playlists
  body: |
    ### Get playlists

    Reads playlists by ID, of a channel, or of the connected account. Calls youtube.playlists.list (GET /youtube/v3/playlists) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_playlists` · reads only · YouTube: `GET /youtube/v3/playlists`

    Inputs: `page_token`, `part` (required), `on_behalf_of_content_owner_channel`, `on_behalf_of_content_owner`, `hl`, `mine`, `channel_id`, `id`, `max_results`, `all_pages`, `max_items`, `skip`.

    ### Create playlist from body

    Creates a playlist. Calls youtube.playlists.insert (POST /youtube/v3/playlists) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `create_playlist_from_body` · changes data in YouTube · YouTube: `POST /youtube/v3/playlists`

    Inputs: `on_behalf_of_content_owner`, `on_behalf_of_content_owner_channel`, `part` (required), `body` (required).

    ### Update playlist

    Changes a playlist's title, description, privacy or localizations. Calls youtube.playlists.update (PUT /youtube/v3/playlists) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `update_playlist` · changes data in YouTube · YouTube: `PUT /youtube/v3/playlists`

    Inputs: `on_behalf_of_content_owner`, `part` (required), `body` (required).

    ### Delete playlist

    Deletes a playlist. Calls youtube.playlists.delete (DELETE /youtube/v3/playlists) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `delete_playlist` · changes data in YouTube · YouTube: `DELETE /youtube/v3/playlists`

    Inputs: `id` (required), `on_behalf_of_content_owner`.

    ### Get playlist items

    Reads the items of a playlist, or items by ID. Calls youtube.playlistItems.list (GET /youtube/v3/playlistItems) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_playlist_items` · reads only · YouTube: `GET /youtube/v3/playlistItems`

    Inputs: `max_results`, `video_id`, `playlist_id`, `id`, `page_token`, `part` (required), `on_behalf_of_content_owner`, `all_pages`, `max_items`, `skip`.

    ### Create playlist item

    Adds a video to a playlist. Calls youtube.playlistItems.insert (POST /youtube/v3/playlistItems) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `create_playlist_item` · changes data in YouTube · YouTube: `POST /youtube/v3/playlistItems`

    Inputs: `on_behalf_of_content_owner`, `part` (required), `body` (required).

    ### Update playlist item

    Changes a playlist item, for example its position. Calls youtube.playlistItems.update (PUT /youtube/v3/playlistItems) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `update_playlist_item` · changes data in YouTube · YouTube: `PUT /youtube/v3/playlistItems`

    Inputs: `part` (required), `on_behalf_of_content_owner`, `body` (required).

    ### Delete playlist item

    Removes an item from a playlist. Calls youtube.playlistItems.delete (DELETE /youtube/v3/playlistItems) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `delete_playlist_item` · changes data in YouTube · YouTube: `DELETE /youtube/v3/playlistItems`

    Inputs: `on_behalf_of_content_owner`, `id` (required).

    ### Get playlist images

    Reads the cover images of a playlist. Calls youtube.playlistImages.list (GET /youtube/v3/playlistImages) of the YouTube Data API. The YouTube quota table gives no cost for it. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_playlist_images` · reads only · YouTube: `GET /youtube/v3/playlistImages`

    Inputs: `part`, `parent`, `page_token`, `on_behalf_of_content_owner_channel`, `max_results`, `on_behalf_of_content_owner`, `all_pages`, `max_items`, `skip`.

    ### Upload playlist image

    Uploads a playlist cover image from a workflow file. Calls youtube.playlistImages.insert (POST /youtube/v3/playlistImages) of the YouTube Data API. The YouTube quota table gives no cost for it. The workflow file in file (required) is sent by YouTube's resumable upload, up to 50 MiB here (YouTube: 50 MiB). Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `upload_playlist_image` · changes data in YouTube · YouTube: `POST /youtube/v3/playlistImages`

    Inputs: `part`, `on_behalf_of_content_owner`, `on_behalf_of_content_owner_channel`, `body`, `file` (required), `content_type`.

    ### Update playlist image

    Changes a playlist cover image, optionally with a new image file. Calls youtube.playlistImages.update (PUT /youtube/v3/playlistImages) of the YouTube Data API. The YouTube quota table gives no cost for it. The workflow file in file (optional) is sent by YouTube's resumable upload, up to 50 MiB here (YouTube: 50 MiB). Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `update_playlist_image` · changes data in YouTube · YouTube: `PUT /youtube/v3/playlistImages`

    Inputs: `part`, `on_behalf_of_content_owner`, `body`, `file`, `content_type`.

    ### Delete playlist image

    Removes a playlist cover image. Calls youtube.playlistImages.delete (DELETE /youtube/v3/playlistImages) of the YouTube Data API. The YouTube quota table gives no cost for it. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `delete_playlist_image` · changes data in YouTube · YouTube: `DELETE /youtube/v3/playlistImages`

    Inputs: `on_behalf_of_content_owner`, `id`.
