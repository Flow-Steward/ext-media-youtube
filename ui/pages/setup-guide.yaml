page_id: setup-guide
title: Setup Guide
description: Set up the Google OAuth client once, then connect each YouTube channel.
project_scoped: true
components:
  - component_id: setup_operator
    type: markdown
    title: For the person who sets up Google Cloud
    body: |
      This needs a Google account that can create projects in
      [Google Cloud](https://console.cloud.google.com). The people who later connect
      their channels do not need one.

      Flow Steward authorizes with Google's OAuth 2.0 authorization code flow and your
      own OAuth client: the client belongs to you, and Google shows its name on the
      consent page.

      **First, get the redirect URI from Flow Steward.** Open this extension's
      **Connection** page in the project you are configuring and copy the
      **OAuth Redirect URI**. Google refuses the authorization unless it matches
      character for character. Each Flow Steward project has its own; add every one you
      use to the OAuth client.

      **Create the project and enable the API**

      1. Google Cloud → project picker → **New project**, or choose an existing one.
      2. **APIs & Services → Library** → **YouTube Data API v3** → **Enable**.

      **Configure the OAuth consent screen**

      1. **APIs & Services → OAuth consent screen** (Google Auth Platform → Branding,
         Audience, Data access).
      2. **User type: External** for channels of any Google account, or **Internal** if
         every channel belongs to accounts of your Google Workspace organization.
      3. App name, support email and developer contact.
      4. **Data access → Add or remove scopes**: add
         `https://www.googleapis.com/auth/youtube.force-ssl`, and also
         `youtube.channel-memberships.creator`, `youtubepartner` and
         `youtubepartner-channel-audit` if you will use the connections that need them
         (see **Which connection type**).
      5. **Audience**: while the app is in **Testing**, add every Google account that
         will connect a channel as a **test user**. Google refuses other accounts.

      **Testing or In production.** For an external app in **Testing**, Google issues
      refresh tokens that expire in 7 days: the connection then has to be connected
      again every week. Publish the app (**In production**) for lasting connections.
      Whether Google must verify the app first follows Google's policies for the scopes
      it asks for.

      **Create the OAuth client**

      1. **APIs & Services → Credentials → Create credentials → OAuth client ID**.
      2. **Application type: Web application**.
      3. **Authorized redirect URIs**: add the OAuth Redirect URI from Flow Steward.
      4. **Create**, then copy the **Client ID** and **Client Secret**.

      **Store the credentials in Flow Steward.** On the **Connection** page enter the
      Client ID and Client Secret and save them. The secret is kept encrypted and never
      shown again.
  - component_id: setup_connector
    type: markdown
    title: For the person who connects a channel
    body: |
      You need the Google account that owns or manages the channel, and operator or
      admin access to the Flow Steward project. You do not create or copy any token.

      1. Open this extension's **Connection** page (or **Connection with memberships**,
         **Content owner connection** — see below) and press **Connect**.
      2. Google opens its sign-in page. Choose the account, then the channel: an account
         with several channels (brand accounts) asks which one.
      3. Google shows what the app asks for. Allow it.
      4. You land back in Flow Steward with the connection created. Press
         **Test connection**: it reads the channel the authorization belongs to and shows
         its ID, title and handle.

      Each connection is one channel. Connect again to add another channel; press
      **Connect** on an existing connection to renew it.
  - component_id: setup_types
    type: markdown
    title: Which connection type
    body: |
      - **YouTube channel** (page **Connection**) asks for `youtube.force-ssl`: videos,
        playlists, comments, captions, live streams, subscriptions and the channel.
      - **YouTube channel with memberships** (page **Connection with memberships**) also
        asks for `youtube.channel-memberships.creator`, for **Get channel members** and
        **Get membership levels**.
      - **YouTube content owner** (page **Content owner connection**) is for YouTube
        partners with a CMS account: it also asks for `youtubepartner` and
        `youtubepartner-channel-audit`, for the `on_behalf_of_content_owner` inputs.

      Every step names the scopes that allow it and offers only the connection types
      that have one of them.

      Channel and video reports come from the separate extension
      [YouTube Analytics](https://github.com/Flow-Steward/ext-marketing-youtube-analytics)
      (`flowsteward.youtube-analytics`).
  - component_id: setup_quota
    type: markdown
    title: Quota
    body: |
      YouTube counts every request against the daily quota of your Google Cloud project.
      Google's getting-started guide gives projects a default allocation of 100
      `search.list` calls, 100 `videos.insert` calls and 10,000 units per day for all
      other endpoints, and says the default may change. Each step names its cost in
      quota units from YouTube's quota table: a read usually costs 1 unit, a change 50.

      When the quota is used up, YouTube refuses with `quotaExceeded` and the step says
      so; nothing is changed. The quota renews daily; more can be requested with
      Google's quota extension form. **APIs & Services → YouTube Data API v3 → Quotas**
      shows what is used.
  - component_id: setup_upload
    type: markdown
    title: Uploading videos and files
    body: |
      **Upload video**, **Set video thumbnail** and the caption steps take a workflow
      file from an earlier step and send it with YouTube's resumable upload, in parts of
      8 MiB. Flow Steward reads a workflow file of up to 200 MiB unless the host is set
      to another size.

      An uploaded video is first **accepted**: YouTube processes it afterwards. Read its
      state with **Get video processing status** before changing it further. A new video
      is private unless the step says otherwise.
  - component_id: setup_errors
    type: markdown
    title: If something fails
    body: |
      - **redirect_uri_mismatch** on Google's page — add the OAuth Redirect URI shown on
        **Connection** to the OAuth client, exactly as shown.
      - **access_denied** or "has not completed the Google verification process" — the
        account is not a test user of an app in **Testing**; add it on **Audience**, or
        publish the app.
      - **invalid_client** — the Client ID or Client Secret is wrong, or the client was
        deleted. Copy both again from Google Cloud.
      - **The connection stops working after a week** — the app is in **Testing**;
        publish it, then connect again.
      - **accessNotConfigured** or "YouTube Data API v3 has not been used in project" —
        enable YouTube Data API v3 in the project.
      - **insufficientPermissions** or a 403 naming a scope — the connection type lacks
        the scope the step names; use the type that has it.
      - **Test connection finds no channel** — the Google account has no YouTube channel,
        or another channel was chosen. Connect again and choose the channel.
      - **quotaExceeded** — the project's daily quota is used up. Run the step again when
        it renews, or ask Google for more.
      - **forbidden** on a video, playlist or comment — the connected channel does not own
        it or may not change it.

      A test run of a workflow never sends changes to YouTube.
