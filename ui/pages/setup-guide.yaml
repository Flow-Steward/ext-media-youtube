page_id: setup-guide
title: Setup Guide
description: Connect a YouTube channel in a few minutes.
components:
  - component_id: setup_steps
    type: markdown
    title: Connect YouTube
    body: |
      1. **Create or choose a Google Cloud project** at [console.cloud.google.com](https://console.cloud.google.com).
      2. **Enable the API.** In the API Library enable **YouTube Data API v3**.
      3. **Configure the OAuth consent screen** of the project. Whether the app must be verified by Google, and who may sign in while it is in testing, follows Google's policies for the scopes it asks for.
      4. **Create an OAuth client** of the type **Web application** and add the OAuth Redirect URI shown on the **Connection** page as an authorized redirect URI, exactly as shown.
      5. **Copy the Client ID and Client Secret** of that client into **Connection** and save them.
      6. Choose a connection type, press **Connect**, sign in with the Google account of the channel, choose the channel and allow the access. Then press **Test connection**.
      7. Add YouTube steps to a workflow. Start with **Test connection**, **Get my channels** or **Get all channel videos**, then add the steps that change data.

      [Google: OAuth 2.0 for web server applications](https://developers.google.com/identity/protocols/oauth2/web-server)

      [YouTube Data API: getting started](https://developers.google.com/youtube/v3/getting-started)
  - component_id: setup_types
    type: markdown
    title: Which connection type
    body: |
      - **YouTube channel** asks for `youtube.force-ssl`: videos, playlists, comments, captions and live streams.
      - **YouTube channel with memberships** also asks for `youtube.channel-memberships.creator` (Get channel members, Get membership levels).
      - **YouTube content owner** is for YouTube partners with a CMS account: it also asks for `youtubepartner` and `youtubepartner-channel-audit`, for the `on_behalf_of_content_owner` inputs.

      YouTube Analytics reports are in the separate extension [YouTube Analytics](https://github.com/Flow-Steward/ext-marketing-youtube-analytics) (`flowsteward.youtube-analytics`).

      A step names the scopes that allow it. If the connection lacks one, YouTube refuses the step and nothing changes.
  - component_id: setup_quota
    type: markdown
    title: Quota
    body: |
      YouTube counts every request against the daily quota of your Google Cloud project. Each step names its cost in quota units from YouTube's quota table. When the quota is used up, YouTube refuses with `quotaExceeded` and the step says so; nothing is changed. The quota can be seen and raised in Google Cloud.

      A **test run** of a workflow never sends changes.
