title: YouTube API
description: How the YouTube steps work, and the everyday steps.
components:
- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    The steps call the YouTube Data API v3 and the YouTube Analytics API v2 for the connected channel. Every method of the two APIs has a step: 103 steps in all, the everyday ones first.

    - **Scopes.** Each step names the Google scopes that allow it. The connection type decides which scopes are asked for: YouTube channel, YouTube channel with revenue and memberships, or YouTube content owner.
    - **Quota.** YouTube does not report the quota left in its answers. Each Data API step names its cost in quota units from YouTube's quota table; when the daily quota is used up, YouTube refuses with quotaExceeded and the step says so.
    - **Results.** A generated step returns `status`, `data` (YouTube's JSON) or `file` (a workflow file for a caption track), `etag` and `warnings`; a list also returns `items`, `count`, `complete` and `next_page_token`.
    - **Lists.** With `all_pages` a list step reads page after page; when it stops early, `next_page_token` is where the next run starts, so nothing is skipped or read twice.
    - **Request bodies** are the YouTube resource as JSON in `body`, with the parts named in `part`. A field the resource does not have is refused before sending.
    - **Accepted or completed.** Every step that changes data returns `processing`: `completed` when YouTube answered that the change is made, `accepted` for an uploaded video, which YouTube processes afterwards; then `applied` is false and `check` names Get video processing status.
    - **Changes are sent once.** A step that changes data is never retried automatically; when its outcome is unclear it says so, and you check YouTube before running it again. Test runs never send changes.

    The steps by area:

    - **Channels** (16 steps)
    - **Videos** (14 steps)
    - **Playlists** (12 steps)
    - **Comments and captions** (13 steps)
    - **Live streaming** (21 steps)
    - **Subscriptions and regions** (5 steps)
    - **Analytics** (8 steps)
- component_id: steps_everyday
  type: markdown
  title: Everyday
  body: |
    ### Test connection

    Checks that YouTube accepts the connection's authorization by reading the channel it belongs to (channels.list with mine). Returns the channel ID, title and handle. Quota cost: 1 unit.

    Action id `test_connection` · reads only · YouTube: `GET /youtube/v3/channels`

    Inputs: none.

    Results: `connected`, `channel_id`, `title`, `custom_url`, `connection_type`, `warnings`.

    ### Get my channels

    Reads the channels of the connected account with their snippet, statistics (views, subscribers, videos), content details (the uploads playlist) and status, all pages. Quota cost: 1 unit per page.

    Action id `list_my_channels` · reads only · YouTube: `GET /youtube/v3/channels`

    Inputs: none.

    Results: `channels`, `count`, `complete`, `next_page_token`, `warnings`.

    ### Get all channel videos

    Reads every video of a channel (the connected one when channel_id is empty) through its uploads playlist, 50 per page, until all are read or max_videos, the step output (or with output file a JSON workflow file) is full or time runs out; then complete is false and next_page_token says where to continue. Each record is a playlist item with the video ID in contentDetails.videoId. Quota cost: 1 unit per page plus 1 for the channel.

    Action id `list_channel_videos` · reads only · YouTube: `GET /youtube/v3/channels`, `GET /youtube/v3/playlistItems`

    Inputs: `channel_id`, `max_videos`, `page_token`, `output`.

    Results: `channel_id`, `uploads_playlist_id`, `videos`, `count`, `complete`, `next_page_token`, `file`, `warnings`.

    ### Get videos by ID

    Reads videos by ID, 50 per request, with the parts asked for (default snippet, contentDetails, statistics and status). IDs YouTube does not return are in missing_ids; IDs not read because the output is full or time ran out are in unread_ids. Quota cost: 1 unit per 50 IDs.

    Action id `get_videos_by_id` · reads only · YouTube: `GET /youtube/v3/videos`

    Inputs: `video_ids` (required), `parts`.

    Results: `videos`, `count`, `missing_ids`, `unread_ids`, `warnings`.

    ### Upload video

    Uploads a video from a workflow file (up to 200 MiB, the Flow Steward default for a workflow file; YouTube allows 256 GiB) with YouTube's resumable upload, with its title, description, tags, category and privacy (default private). YouTube processes the video afterwards: the step returns the new video_id with processing accepted and applied false; read the outcome with Get video processing status. Quota (YouTube's quota table): "100 quota per day. Each call costs 1 quota."

    Action id `upload_video` · changes data in YouTube · YouTube: `POST /upload/youtube/v3/videos`, `PUT (upload session)`

    Inputs: `file` (required), `content_type`, `title` (required), `description`, `tags`, `category_id`, `default_language`, `privacy_status`, `publish_at`, `made_for_kids`, `contains_synthetic_media`, `embeddable`, `notify_subscribers`.

    Results: `video_id`, `upload_status`, `size_bytes`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Get video processing status

    Reads how far YouTube got with an uploaded video: status.uploadStatus and, for the video's owner, processingDetails (processing status, progress, failure reason). finished is true once YouTube processed, failed, rejected or deleted it. Quota cost: 1 unit.

    Action id `get_video_processing_status` · reads only · YouTube: `GET /youtube/v3/videos`

    Inputs: `video_id` (required).

    Results: `video_id`, `upload_status`, `processing_status`, `privacy_status`, `progress`, `failure_reason`, `rejection_reason`, `finished`, `warnings`.

    ### Update video details

    Changes a video's title, description, tags, category, language, privacy, publishing time or audience. It reads the video first and sends the snippet and status parts with the fields not given kept as they are, because YouTube clears what a sent part leaves out. Quota cost: 1 unit to read, 50 to update.

    Action id `update_video_details` · changes data in YouTube · YouTube: `GET /youtube/v3/videos`, `PUT /youtube/v3/videos`

    Inputs: `video_id` (required), `title`, `description`, `tags`, `category_id`, `default_language`, `privacy_status`, `publish_at`, `made_for_kids`, `contains_synthetic_media`, `embeddable`.

    Results: `video_id`, `updated_parts`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Set video thumbnail

    Uploads a JPEG or PNG from a workflow file as a video's custom thumbnail. Quota cost: 50 units.

    Action id `set_video_thumbnail` · changes data in YouTube · YouTube: `POST /upload/youtube/v3/thumbnails/set`, `PUT (upload session)`

    Inputs: `video_id` (required), `file` (required), `content_type`.

    Results: `video_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Get all video comments

    Reads every top-level comment of a video, 100 per page, optionally with the replies YouTube includes in a thread, until all are read or max_comments, the step output (or with output file a JSON workflow file) is full or time runs out; then complete is false and next_page_token says where to continue. Quota cost: 1 unit per page.

    Action id `list_video_comments` · reads only · YouTube: `GET /youtube/v3/commentThreads`

    Inputs: `video_id` (required), `order`, `search_terms`, `text_format`, `include_replies`, `max_comments`, `page_token`, `output`.

    Results: `comments`, `count`, `complete`, `next_page_token`, `file`, `warnings`.

    ### Reply to comment

    Posts a reply to a comment as the connected channel. Returns the new comment_id. Quota cost: 50 units.

    Action id `reply_to_comment` · changes data in YouTube · YouTube: `POST /youtube/v3/comments`

    Inputs: `parent_id` (required), `text` (required).

    Results: `comment_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Get all my playlists

    Reads every playlist of the connected channel with its snippet, item count and privacy, 50 per page, until all are read or max_playlists; then complete is false and next_page_token says where to continue. Quota cost: 1 unit per page.

    Action id `list_my_playlists` · reads only · YouTube: `GET /youtube/v3/playlists`

    Inputs: `max_playlists`, `page_token`.

    Results: `playlists`, `count`, `complete`, `next_page_token`, `warnings`.

    ### Create playlist

    Creates a playlist on the connected channel with a title, description, tags and privacy (default private). Returns the new playlist_id. Quota cost: 50 units.

    Action id `create_playlist` · changes data in YouTube · YouTube: `POST /youtube/v3/playlists`

    Inputs: `title` (required), `description`, `privacy_status`, `default_language`, `tags`.

    Results: `playlist_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Add video to playlist

    Adds a video to a playlist, at the end or at a position (0 is the first). Returns the new playlist_item_id. Quota cost: 50 units.

    Action id `add_video_to_playlist` · changes data in YouTube · YouTube: `POST /youtube/v3/playlistItems`

    Inputs: `playlist_id` (required), `video_id` (required), `position`.

    Results: `playlist_item_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Get analytics report

    Reads a YouTube Analytics report for the connected channel (or channel_id), or for one video with video_id: the metrics asked for, by the dimensions asked for, from start_date to end_date. Numbers are exact decimals. Revenue metrics need the connection type YouTube channel with revenue and memberships.

    Action id `get_analytics_report` · reads only · YouTube: `GET /v2/reports`

    Inputs: `start_date` (required), `end_date` (required), `metrics` (required), `dimensions`, `video_id`, `channel_id`, `filters`, `sort`, `max_results`, `currency`.

    Results: `column_headers`, `rows`, `row_count`, `warnings`.
