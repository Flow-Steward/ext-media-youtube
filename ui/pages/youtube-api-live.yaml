components:
- component_id: steps_live_streaming
  type: markdown
  title: Live streaming
  body: |
    ### Get live broadcasts

    Reads live broadcasts by ID, status or of the connected account. YouTube: Retrieve the list of broadcasts associated with the given channel. Calls youtube.liveBroadcasts.list (GET /youtube/v3/liveBroadcasts) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly.

    Action id `get_live_broadcasts` · reads only · YouTube: `GET /youtube/v3/liveBroadcasts`

    Inputs: `broadcast_type`, `on_behalf_of_content_owner_channel`, `max_results`, `page_token`, `on_behalf_of_content_owner`, `part` (required), `mine`, `id`, `broadcast_status`, `all_pages`, `max_items`, `skip`.

    ### Change live broadcast status

    Moves a live broadcast to testing, live or complete. YouTube: Transition a broadcast to a given status. Calls youtube.liveBroadcasts.transition (POST /youtube/v3/liveBroadcasts/transition) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl.

    Action id `change_live_broadcast_status` · changes data in YouTube · YouTube: `POST /youtube/v3/liveBroadcasts/transition`

    Inputs: `part` (required), `broadcast_status` (required), `on_behalf_of_content_owner`, `on_behalf_of_content_owner_channel`, `id` (required).

    ### Create live broadcast

    Creates a live broadcast. YouTube: Inserts a new stream for the authenticated user. Calls youtube.liveBroadcasts.insert (POST /youtube/v3/liveBroadcasts) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl.

    Action id `create_live_broadcast` · changes data in YouTube · YouTube: `POST /youtube/v3/liveBroadcasts`

    Inputs: `part` (required), `on_behalf_of_content_owner_channel`, `on_behalf_of_content_owner`, `body` (required).

    ### Insert broadcast cuepoint

    Inserts a cuepoint (an ad break) into a live broadcast. YouTube: Insert cuepoints in a broadcast Calls youtube.liveBroadcasts.insertCuepoint (POST /youtube/v3/liveBroadcasts/cuepoint) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `insert_broadcast_cuepoint` · changes data in YouTube · YouTube: `POST /youtube/v3/liveBroadcasts/cuepoint`

    Inputs: `on_behalf_of_content_owner`, `part`, `on_behalf_of_content_owner_channel`, `id`, `body` (required).

    ### Bind live broadcast to stream

    Binds a live broadcast to a video stream, or removes the binding. YouTube: Bind a broadcast to a stream. Calls youtube.liveBroadcasts.bind (POST /youtube/v3/liveBroadcasts/bind) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl.

    Action id `bind_live_broadcast_to_stream` · changes data in YouTube · YouTube: `POST /youtube/v3/liveBroadcasts/bind`

    Inputs: `stream_id`, `on_behalf_of_content_owner`, `on_behalf_of_content_owner_channel`, `part` (required), `id` (required).

    ### Update live broadcast

    Changes a live broadcast. YouTube: Updates an existing broadcast for the authenticated user. Calls youtube.liveBroadcasts.update (PUT /youtube/v3/liveBroadcasts) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl.

    Action id `update_live_broadcast` · changes data in YouTube · YouTube: `PUT /youtube/v3/liveBroadcasts`

    Inputs: `part` (required), `on_behalf_of_content_owner`, `on_behalf_of_content_owner_channel`, `body` (required).

    ### Delete live broadcast

    Deletes a live broadcast. YouTube: Delete a given broadcast. Calls youtube.liveBroadcasts.delete (DELETE /youtube/v3/liveBroadcasts) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl.

    Action id `delete_live_broadcast` · changes data in YouTube · YouTube: `DELETE /youtube/v3/liveBroadcasts`

    Inputs: `on_behalf_of_content_owner`, `id` (required), `on_behalf_of_content_owner_channel`.

    ### Get live streams

    Reads video streams by ID or of the connected account. YouTube: Retrieve the list of streams associated with the given channel. -- Calls youtube.liveStreams.list (GET /youtube/v3/liveStreams) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly.

    Action id `get_live_streams` · reads only · YouTube: `GET /youtube/v3/liveStreams`

    Inputs: `page_token`, `on_behalf_of_content_owner`, `max_results`, `on_behalf_of_content_owner_channel`, `id`, `part` (required), `mine`, `all_pages`, `max_items`, `skip`.

    ### Create live stream

    Creates a video stream. YouTube: Inserts a new stream for the authenticated user. Calls youtube.liveStreams.insert (POST /youtube/v3/liveStreams) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl.

    Action id `create_live_stream` · changes data in YouTube · YouTube: `POST /youtube/v3/liveStreams`

    Inputs: `part` (required), `on_behalf_of_content_owner`, `on_behalf_of_content_owner_channel`, `body` (required).

    ### Update live stream

    Changes a video stream. YouTube: Updates an existing stream for the authenticated user. Calls youtube.liveStreams.update (PUT /youtube/v3/liveStreams) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl.

    Action id `update_live_stream` · changes data in YouTube · YouTube: `PUT /youtube/v3/liveStreams`

    Inputs: `part` (required), `on_behalf_of_content_owner`, `on_behalf_of_content_owner_channel`, `body` (required).

    ### Delete live stream

    Deletes a video stream. YouTube: Deletes an existing stream for the authenticated user. Calls youtube.liveStreams.delete (DELETE /youtube/v3/liveStreams) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl.

    Action id `delete_live_stream` · changes data in YouTube · YouTube: `DELETE /youtube/v3/liveStreams`

    Inputs: `id` (required), `on_behalf_of_content_owner_channel`, `on_behalf_of_content_owner`.

    ### Get live chat messages

    Reads the messages of a live chat. YouTube: Retrieves a list of resources, possibly filtered. A call to this method has a quota cost of 5 units. Calls youtube.liveChatMessages.list (GET /youtube/v3/liveChat/messages) of the YouTube Data API. Quota cost: 5 units per call. Google scopes: youtube, youtube.force-ssl, youtube.readonly.

    Action id `get_live_chat_messages` · reads only · YouTube: `GET /youtube/v3/liveChat/messages`

    Inputs: `part` (required), `profile_image_size`, `hl`, `max_results`, `page_token`, `live_chat_id` (required).

    ### Change live chat event status

    Transitions a durable chat event, such as a poll. YouTube: Transitions a durable chat event. A call to this method has a quota cost of 20 units. Calls youtube.liveChatMessages.transition (POST /youtube/v3/liveChat/messages/transition) of the YouTube Data API. Quota cost: 20 units per call. Google scopes: youtube, youtube.force-ssl.

    Action id `change_live_chat_event_status` · changes data in YouTube · YouTube: `POST /youtube/v3/liveChat/messages/transition`

    Inputs: `id`, `status`.

    ### Send live chat message

    Posts a message to a live chat. YouTube: Inserts a new resource into this collection. A call to this method has a quota cost of 20 units. Calls youtube.liveChatMessages.insert (POST /youtube/v3/liveChat/messages) of the YouTube Data API. Quota cost: 20 units per call. Google scopes: youtube, youtube.force-ssl.

    Action id `send_live_chat_message` · changes data in YouTube · YouTube: `POST /youtube/v3/liveChat/messages`

    Inputs: `part` (required), `body` (required).

    ### Delete live chat message

    Deletes a live chat message. YouTube: Deletes a chat message. A call to this method has a quota cost of 20 units. Calls youtube.liveChatMessages.delete (DELETE /youtube/v3/liveChat/messages) of the YouTube Data API. Quota cost: 20 units per call. Google scopes: youtube, youtube.force-ssl.

    Action id `delete_live_chat_message` · changes data in YouTube · YouTube: `DELETE /youtube/v3/liveChat/messages`

    Inputs: `id` (required).

    ### Ban live chat user

    Bans a user from a live chat, for a time or permanently. Calls youtube.liveChatBans.insert (POST /youtube/v3/liveChat/bans) of the YouTube Data API. Quota cost: 200 units per call. Google scopes: youtube, youtube.force-ssl.

    Action id `ban_live_chat_user` · changes data in YouTube · YouTube: `POST /youtube/v3/liveChat/bans`

    Inputs: `part` (required), `body` (required).

    ### Remove live chat ban

    Lifts a live chat ban. YouTube: Deletes a chat ban. Calls youtube.liveChatBans.delete (DELETE /youtube/v3/liveChat/bans) of the YouTube Data API. Quota cost: 200 units per call. Google scopes: youtube, youtube.force-ssl.

    Action id `remove_live_chat_ban` · changes data in YouTube · YouTube: `DELETE /youtube/v3/liveChat/bans`

    Inputs: `id` (required).

    ### Get live chat moderators

    Reads the moderators of a live chat. Calls youtube.liveChatModerators.list (GET /youtube/v3/liveChat/moderators) of the YouTube Data API. Quota cost: 50 units per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly.

    Action id `get_live_chat_moderators` · reads only · YouTube: `GET /youtube/v3/liveChat/moderators`

    Inputs: `max_results`, `part` (required), `page_token`, `live_chat_id` (required), `all_pages`, `max_items`, `skip`.

    ### Add live chat moderator

    Makes a user a moderator of a live chat. Calls youtube.liveChatModerators.insert (POST /youtube/v3/liveChat/moderators) of the YouTube Data API. Quota cost: 200 units per call. Google scopes: youtube, youtube.force-ssl.

    Action id `add_live_chat_moderator` · changes data in YouTube · YouTube: `POST /youtube/v3/liveChat/moderators`

    Inputs: `part` (required), `body` (required).

    ### Remove live chat moderator

    Removes a live chat moderator. YouTube: Deletes a chat moderator. Calls youtube.liveChatModerators.delete (DELETE /youtube/v3/liveChat/moderators) of the YouTube Data API. Quota cost: 200 units per call. Google scopes: youtube, youtube.force-ssl.

    Action id `remove_live_chat_moderator` · changes data in YouTube · YouTube: `DELETE /youtube/v3/liveChat/moderators`

    Inputs: `id` (required).

    ### Get Super Chat events

    Reads the Super Chat and Super Sticker events of the connected channel. Calls youtube.superChatEvents.list (GET /youtube/v3/superChatEvents) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly.

    Action id `get_super_chat_events` · reads only · YouTube: `GET /youtube/v3/superChatEvents`

    Inputs: `hl`, `part` (required), `page_token`, `max_results`, `all_pages`, `max_items`, `skip`.
