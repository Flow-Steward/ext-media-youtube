- component_id: steps_analytics
  type: markdown
  title: Analytics
  body: |
    ### Query analytics report

    Reads a YouTube Analytics report: metrics by dimensions for a channel or content owner over a date range. YouTube: Retrieve your YouTube Analytics reports. Calls youtubeAnalytics.reports.query (GET /v2/reports) of the YouTube Analytics API. Google scopes: youtube, youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.

    Action id `query_analytics_report` · reads only · YouTube: `GET /v2/reports`

    Inputs: `end_date` (required), `filters`, `sort`, `start_index`, `metrics` (required), `max_results`, `ids` (required), `start_date` (required), `currency`, `dimensions`, `include_historical_channel_data`.

    ### Get analytics groups

    Reads YouTube Analytics groups by ID or of the connected account. YouTube: Returns a collection of groups that match the API request parameters. For example, you can retrieve all groups that the authenticated user owns, or you can retrieve one or more groups by their unique IDs. Calls youtubeAnalytics.groups.list (GET /v2/groups) of the YouTube Analytics API. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.

    Action id `get_analytics_groups` · reads only · YouTube: `GET /v2/groups`

    Inputs: `on_behalf_of_content_owner`, `page_token`, `mine`, `id`, `all_pages`, `max_items`.

    ### Create analytics group

    Creates a YouTube Analytics group of videos, playlists, channels or assets. YouTube: Creates a group. Calls youtubeAnalytics.groups.insert (POST /v2/groups) of the YouTube Analytics API. Google scopes: youtube, youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.

    Action id `create_analytics_group` · changes data in YouTube · YouTube: `POST /v2/groups`

    Inputs: `on_behalf_of_content_owner`, `body` (required).

    ### Update analytics group

    Changes a YouTube Analytics group, for example its title. YouTube: Modifies a group. For example, you could change a group's title. Calls youtubeAnalytics.groups.update (PUT /v2/groups) of the YouTube Analytics API. Google scopes: youtube, youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.

    Action id `update_analytics_group` · changes data in YouTube · YouTube: `PUT /v2/groups`

    Inputs: `on_behalf_of_content_owner`, `body` (required).

    ### Delete analytics group

    Deletes a YouTube Analytics group. YouTube: Deletes a group. Calls youtubeAnalytics.groups.delete (DELETE /v2/groups) of the YouTube Analytics API. Google scopes: youtube, youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.

    Action id `delete_analytics_group` · changes data in YouTube · YouTube: `DELETE /v2/groups`

    Inputs: `on_behalf_of_content_owner`, `id`.

    ### Get analytics group items

    Reads the items of a YouTube Analytics group. YouTube: Returns a collection of group items that match the API request parameters. Calls youtubeAnalytics.groupItems.list (GET /v2/groupItems) of the YouTube Analytics API. Google scopes: youtube, youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.

    Action id `get_analytics_group_items` · reads only · YouTube: `GET /v2/groupItems`

    Inputs: `group_id`, `on_behalf_of_content_owner`.

    ### Add analytics group item

    Adds an item to a YouTube Analytics group. YouTube: Creates a group item. Calls youtubeAnalytics.groupItems.insert (POST /v2/groupItems) of the YouTube Analytics API. Google scopes: youtube, youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.

    Action id `add_analytics_group_item` · changes data in YouTube · YouTube: `POST /v2/groupItems`

    Inputs: `on_behalf_of_content_owner`, `body` (required).

    ### Remove analytics group item

    Removes an item from a YouTube Analytics group. YouTube: Removes an item from a group. Calls youtubeAnalytics.groupItems.delete (DELETE /v2/groupItems) of the YouTube Analytics API. Google scopes: youtube, youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.

    Action id `remove_analytics_group_item` · changes data in YouTube · YouTube: `DELETE /v2/groupItems`

    Inputs: `id`, `on_behalf_of_content_owner`.
