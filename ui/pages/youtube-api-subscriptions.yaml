  type: markdown
  title: Subscriptions and regions
  body: |
    ### Get subscriptions

    Reads subscriptions by ID, of a channel, of the connected account or its subscribers. Calls youtube.subscriptions.list (GET /youtube/v3/subscriptions) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_subscriptions` · reads only · YouTube: `GET /youtube/v3/subscriptions`

    Inputs: `my_subscribers`, `on_behalf_of_content_owner`, `max_results`, `my_recent_subscribers`, `id`, `page_token`, `channel_id`, `mine`, `for_channel_id`, `part` (required), `on_behalf_of_content_owner_channel`, `order`, `all_pages`, `max_items`, `skip`.

    ### Create subscription

    Subscribes the connected account to a channel. Calls youtube.subscriptions.insert (POST /youtube/v3/subscriptions) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `create_subscription` · changes data in YouTube · YouTube: `POST /youtube/v3/subscriptions`

    Inputs: `part` (required), `body` (required).

    ### Delete subscription

    Unsubscribes from a channel. Calls youtube.subscriptions.delete (DELETE /youtube/v3/subscriptions) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `delete_subscription` · changes data in YouTube · YouTube: `DELETE /youtube/v3/subscriptions`

    Inputs: `id` (required).

    ### Get interface languages

    Reads the application languages YouTube supports. Calls youtube.i18nLanguages.list (GET /youtube/v3/i18nLanguages) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_interface_languages` · reads only · YouTube: `GET /youtube/v3/i18nLanguages`

    Inputs: `hl`, `part` (required).

    ### Get content regions

    Reads the content regions YouTube supports. Calls youtube.i18nRegions.list (GET /youtube/v3/i18nRegions) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_content_regions` · reads only · YouTube: `GET /youtube/v3/i18nRegions`

    Inputs: `part` (required), `hl`.
