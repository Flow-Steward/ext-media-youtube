page_id: youtube-api-videos
title: 'YouTube API: Videos'
description: The 14 videos steps.
components:
- component_id: steps_videos
  type: markdown
  title: Videos
  body: |
    ### Get my video ratings

    Reads the rating (like, dislike or none) the connected account gave to videos. YouTube: Retrieves the ratings that the authorized user gave to a list of specified videos. Calls youtube.videos.getRating (GET /youtube/v3/videos/getRating) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_my_video_ratings` · reads only · YouTube: `GET /youtube/v3/videos/getRating`

    Inputs: `id` (required), `on_behalf_of_content_owner`.

    ### Get video statistics batch

    Reads the statistics of up to 50 videos by ID. YouTube: Retrieves a batch of VideoStat resources, possibly filtered. BatchGetStats is intentionally not atomic to provide a better user experience. Calls youtube.videos.batchGetStats (GET /youtube/v3/videos:batchGetStats) of the YouTube Data API. The YouTube quota table gives no cost for it. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_video_statistics_batch` · reads only · YouTube: `GET /youtube/v3/videos:batchGetStats`

    Inputs: `id`, `part`, `on_behalf_of_content_owner`.

    ### Get videos

    Reads videos by ID, or the videos the connected account rated, or the most popular videos of a region. Calls youtube.videos.list (GET /youtube/v3/videos) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_videos` · reads only · YouTube: `GET /youtube/v3/videos`

    Inputs: `video_category_id`, `locale`, `part` (required), `hl`, `max_results`, `region_code`, `on_behalf_of_content_owner`, `chart`, `max_height`, `my_rating`, `id`, `page_token`, `max_width`, `all_pages`, `max_items`.

    ### Report video abuse

    Reports a video for abuse. YouTube: Report abuse for a video. Calls youtube.videos.reportAbuse (POST /youtube/v3/videos/reportAbuse) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `report_video_abuse` · changes data in YouTube · YouTube: `POST /youtube/v3/videos/reportAbuse`

    Inputs: `on_behalf_of_content_owner`, `body` (required).

    ### Upload video file

    Uploads a video from a workflow file with its metadata in body, by YouTube's resumable upload. Calls youtube.videos.insert (POST /youtube/v3/videos) of the YouTube Data API. Quota (YouTube's quota table): "100 quota per day. Each call costs 1 quota." The workflow file in file (required) is sent by YouTube's resumable upload, up to 200 MiB here (YouTube: 256 GiB). YouTube processes the video after the upload: the step returns processing "accepted" and applied false; read the outcome with Get video processing status. Google scopes: youtube, youtube.force-ssl, youtube.upload, youtubepartner.

    Action id `upload_video_file` · changes data in YouTube · YouTube: `POST /youtube/v3/videos`

    Inputs: `auto_levels`, `on_behalf_of_content_owner`, `notify_subscribers`, `on_behalf_of_content_owner_channel`, `part` (required), `stabilize`, `body`, `file` (required), `content_type`.

    ### Rate video

    Likes or dislikes a video, or removes the rating. YouTube: Adds a like or dislike rating to a video or removes a rating from a video. Calls youtube.videos.rate (POST /youtube/v3/videos/rate) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `rate_video` · changes data in YouTube · YouTube: `POST /youtube/v3/videos/rate`

    Inputs: `id` (required), `rating` (required).

    ### Update video

    Changes a video's metadata; the parts sent replace the current ones, so fields left out of a part are cleared. Calls youtube.videos.update (PUT /youtube/v3/videos) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `update_video` · changes data in YouTube · YouTube: `PUT /youtube/v3/videos`

    Inputs: `part` (required), `on_behalf_of_content_owner`, `body` (required).

    ### Delete video

    Deletes a video. Calls youtube.videos.delete (DELETE /youtube/v3/videos) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `delete_video` · changes data in YouTube · YouTube: `DELETE /youtube/v3/videos`

    Inputs: `on_behalf_of_content_owner`, `id` (required).

    ### Get video trainability

    Reads whether third parties may use a video for training. YouTube: Returns the trainability status of a video. Calls youtube.videoTrainability.get (GET /youtube/v3/videoTrainability) of the YouTube Data API. The YouTube quota table gives no cost for it. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_video_trainability` · reads only · YouTube: `GET /youtube/v3/videoTrainability`

    Inputs: `id`.

    ### Set video thumbnail file

    Uploads a custom thumbnail image from a workflow file and sets it for a video. YouTube: As this is not an insert in a strict sense (it supports uploading/setting of a thumbnail for multiple videos, which doesn't result in creation of a single resource), I use a custom verb here. Calls youtube.thumbnails.set (POST /youtube/v3/thumbnails/set) of the YouTube Data API. Quota cost: 50 units per call. The workflow file in file (required) is sent by YouTube's resumable upload, up to 50 MiB here (YouTube: 50 MiB). Google scopes: youtube, youtube.force-ssl, youtube.upload, youtubepartner.

    Action id `set_video_thumbnail_file` · changes data in YouTube · YouTube: `POST /youtube/v3/thumbnails/set`

    Inputs: `video_id` (required), `on_behalf_of_content_owner`, `file` (required), `content_type`.

    ### Search YouTube

    Searches videos, channels and playlists by keyword, location or channel. YouTube: Retrieves a list of search resources Calls youtube.search.list (GET /youtube/v3/search) of the YouTube Data API. Quota (YouTube's quota table): "100 quota per day. Each call costs 1 quota." Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `search_youtube` · reads only · YouTube: `GET /youtube/v3/search`

    Inputs: `order`, `page_token`, `video_dimension`, `type`, `max_results`, `video_duration`, `video_syndicated`, `region_code`, `published_after`, `video_type`, `for_mine`, `for_content_owner`, `location`, `event_type`, `safe_search`, `video_category_id`, `channel_type`, `for_developer`, `part` (required), `video_embeddable`, `on_behalf_of_content_owner`, `channel_id`, `location_radius`, `video_license`, `video_caption`, `video_definition`, `published_before`, `video_paid_product_placement`, `q`, `relevance_language`, `topic_id`, `all_pages`, `max_items`.

    ### Get video categories

    Reads the video categories of a region or by ID. Calls youtube.videoCategories.list (GET /youtube/v3/videoCategories) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_video_categories` · reads only · YouTube: `GET /youtube/v3/videoCategories`

    Inputs: `region_code`, `id`, `part` (required), `hl`.

    ### Get abuse report reasons

    Reads the reasons a video can be reported for. Calls youtube.videoAbuseReportReasons.list (GET /youtube/v3/videoAbuseReportReasons) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl, youtube.readonly.

    Action id `get_abuse_report_reasons` · reads only · YouTube: `GET /youtube/v3/videoAbuseReportReasons`

    Inputs: `part` (required), `hl`.

    ### Create abuse report

    Reports content for abuse. Calls youtube.abuseReports.insert (POST /youtube/v3/abuseReports) of the YouTube Data API. The YouTube quota table gives no cost for it. Google scopes: youtube, youtube.force-ssl.

    Action id `create_abuse_report` · changes data in YouTube · YouTube: `POST /youtube/v3/abuseReports`

    Inputs: `part` (required), `body` (required).
