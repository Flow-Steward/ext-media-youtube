components:
- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    The pinned Discovery document of the YouTube Data API v3 (revision 20261119, downloaded 2026-11-23) lists 83 methods; **81 of them have their own step**.

    - **28 reads** (GET) and **53 changes**. Test runs never send changes.
    - **15 list steps** read all pages with `all_pages`; **8 steps upload a file** by resumable upload; one saves a caption track as a file.
    - **68 Data API steps** name their quota cost from YouTube's quota table (updated 2026-11-12).

    Methods without a step:

    - `youtube.tests.insert`: The source documents it only as "POST method." with a TestItem body: it is not a described YouTube feature, so no step is offered for it.
    - `youtube.youtube.v3.liveChat.messages.stream`: A server-streamed RPC: the answer is a stream that stays open while the chat is live, which one workflow step cannot hold. Get live chat messages reads the same messages page by page.

    Other YouTube APIs and resources:

    - **YouTube Analytics API**: Channel and video reports: in the separate extension YouTube Analytics (flowsteward.youtube-analytics, https://github.com/Flow-Steward/ext-marketing-youtube-analytics).
    - **YouTube Reporting API**: Bulk reports YouTube prepares as files on a schedule: a product of its own, with its own Discovery document (youtubereporting v1).
    - **Posts (posts.list, posts.insert, posts.update, posts.delete, posts.imageUpload)**: Not in the pinned Discovery document; Google opens the resource to select launch partners, so only approved Google Cloud projects can call it (https://developers.google.com/youtube/v3/docs/posts).

    The everyday steps on top: test the connection, get my channels, get all videos of a channel, get videos by ID, upload a video and follow its processing, update a video's details and thumbnail, get all comments of a video and reply, get and create playlists and add videos.
