    Returns a CommentThreadListResponse; each item of `items` is a CommentThread with `id`, `snippet`, `etag`, `kind`, `replies`.

    ### Create comment thread (`create_comment_thread`)

    YouTube: `youtube.commentThreads.insert` (`POST /youtube/v3/commentThreads`), quota cost: 50.

    Inputs: `part` (required), `body` (required).

    Body (`body`, a CommentThread): `etag`, `id`, `kind`, `replies`, `snippet`.

