    Inputs: `part` (required), `body` (required).

    Body (`body`, a AbuseReport): `abuseTypes`, `description`, `relatedEntities`, `subject`.

    Returns a AbuseReport with `description`, `subject`, `relatedEntities`, `abuseTypes`.

