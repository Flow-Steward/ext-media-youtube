  body: |+
    ## Everyday

    ### Test connection (`test_connection`)

    YouTube: `GET /youtube/v3/channels`.

    Inputs: none.

    Returns: `connected`, `channel_id`, `title`, `custom_url`, `connection_type`, `warnings`.

    ### Get my channels (`list_my_channels`)

    YouTube: `GET /youtube/v3/channels`.

    Inputs: none.

    Returns: `channels`, `count`, `complete`, `next_page_token`, `next_skip`, `warnings`.

    ### Get all channel videos (`list_channel_videos`)

    YouTube: `GET /youtube/v3/channels`, `GET /youtube/v3/playlistItems`.

    Inputs: `channel_id`, `max_videos`, `page_token`, `skip`, `output`.

    Returns: `channel_id`, `uploads_playlist_id`, `videos`, `count`, `complete`, `next_page_token`, `next_skip`, `file`, `warnings`.

    ### Get videos by ID (`get_videos_by_id`)

    YouTube: `GET /youtube/v3/videos`.

    Inputs: `video_ids` (required), `parts`.

    Returns: `videos`, `count`, `missing_ids`, `unread_ids`, `warnings`.

    ### Upload video (`upload_video`)

    YouTube: `POST /upload/youtube/v3/videos`, `PUT (upload session)`.

    Inputs: `file` (required), `content_type`, `title` (required), `description`, `tags`, `category_id`, `default_language`, `privacy_status`, `publish_at`, `made_for_kids`, `contains_synthetic_media`, `embeddable`, `notify_subscribers`.

    Returns: `video_id`, `upload_status`, `size_bytes`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Get video processing status (`get_video_processing_status`)

    YouTube: `GET /youtube/v3/videos`.

    Inputs: `video_id` (required).

    Returns: `video_id`, `upload_status`, `processing_status`, `privacy_status`, `progress`, `failure_reason`, `rejection_reason`, `finished`, `warnings`.

    ### Update video details (`update_video_details`)

    YouTube: `GET /youtube/v3/videos`, `PUT /youtube/v3/videos`.

    Inputs: `video_id` (required), `title`, `description`, `tags`, `category_id`, `default_language`, `privacy_status`, `publish_at`, `made_for_kids`, `contains_synthetic_media`, `embeddable`.

    Returns: `video_id`, `updated_parts`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Set video thumbnail (`set_video_thumbnail`)

    YouTube: `POST /upload/youtube/v3/thumbnails/set`, `PUT (upload session)`.

    Inputs: `video_id` (required), `file` (required), `content_type`.

    Returns: `video_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Get all video comments (`list_video_comments`)

    YouTube: `GET /youtube/v3/commentThreads`.

    Inputs: `video_id` (required), `order`, `search_terms`, `text_format`, `include_replies`, `max_comments`, `page_token`, `skip`, `output`.

    Returns: `comments`, `count`, `complete`, `next_page_token`, `next_skip`, `file`, `warnings`.

    ### Reply to comment (`reply_to_comment`)

    YouTube: `POST /youtube/v3/comments`.

    Inputs: `parent_id` (required), `text` (required).

    Returns: `comment_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Get all my playlists (`list_my_playlists`)

    YouTube: `GET /youtube/v3/playlists`.

    Inputs: `max_playlists`, `page_token`, `skip`.

    Returns: `playlists`, `count`, `complete`, `next_page_token`, `next_skip`, `warnings`.

    ### Create playlist (`create_playlist`)

    YouTube: `POST /youtube/v3/playlists`.

    Inputs: `title` (required), `description`, `privacy_status`, `default_language`, `tags`.

    Returns: `playlist_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Add video to playlist (`add_video_to_playlist`)

    YouTube: `POST /youtube/v3/playlistItems`.

    Inputs: `playlist_id` (required), `video_id` (required), `position`.

    Returns: `playlist_item_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ## Channels

    ### Get channels (`get_channels`)

    YouTube: `youtube.channels.list` (`GET /youtube/v3/channels`), quota cost: 1.

    Inputs: `on_behalf_of_content_owner`, `my_subscribers`, `id`, `managed_by_me`, `for_username`, `max_results`, `mine`, `hl`, `category_id`, `part` (required), `page_token`, `for_handle`, `all_pages`, `max_items`, `skip`.

    Returns a ChannelListResponse; each item of `items` is a Channel with `snippet`, `brandingSettings`, `auditDetails`, `topicDetails`, `kind`, `contentDetails`, `status`, `conversionPings`, `statistics`, `id`, `contentOwnerDetails`, `etag`, `localizations`.

    ### Update channel (`update_channel`)

    YouTube: `youtube.channels.update` (`PUT /youtube/v3/channels`), quota cost: 50.

    Inputs: `on_behalf_of_content_owner`, `part` (required), `body` (required).

    Body (`body`, a Channel): `auditDetails`, `brandingSettings`, `contentDetails`, `contentOwnerDetails`, `conversionPings`, `etag`, `id`, `kind`, `localizations`, `snippet`, `statistics`, `status`, `topicDetails`.

    Returns a Channel with `snippet`, `brandingSettings`, `auditDetails`, `topicDetails`, `kind`, `contentDetails`, `status`, `conversionPings`, `statistics`, `id`, `contentOwnerDetails`, `etag`, `localizations`.

    ### Get channel sections (`get_channel_sections`)

    YouTube: `youtube.channelSections.list` (`GET /youtube/v3/channelSections`), quota cost: 1.

    Inputs: `mine`, `on_behalf_of_content_owner`, `id`, `part` (required), `channel_id`, `hl`.

    Returns a ChannelSectionListResponse; each item of `items` is a ChannelSection with `localizations`, `kind`, `snippet`, `contentDetails`, `etag`, `id`, `targeting`.

    ### Create channel section (`create_channel_section`)

    YouTube: `youtube.channelSections.insert` (`POST /youtube/v3/channelSections`), quota cost: 50.

    Inputs: `part` (required), `on_behalf_of_content_owner_channel`, `on_behalf_of_content_owner`, `body` (required).

    Body (`body`, a ChannelSection): `contentDetails`, `etag`, `id`, `kind`, `localizations`, `snippet`, `targeting`.

    Returns a ChannelSection with `localizations`, `kind`, `snippet`, `contentDetails`, `etag`, `id`, `targeting`.

    ### Update channel section (`update_channel_section`)

    YouTube: `youtube.channelSections.update` (`PUT /youtube/v3/channelSections`), quota cost: 50.

    Inputs: `on_behalf_of_content_owner`, `part` (required), `body` (required).

    Body (`body`, a ChannelSection): `contentDetails`, `etag`, `id`, `kind`, `localizations`, `snippet`, `targeting`.

    Returns a ChannelSection with `localizations`, `kind`, `snippet`, `contentDetails`, `etag`, `id`, `targeting`.

    ### Delete channel section (`delete_channel_section`)

    YouTube: `youtube.channelSections.delete` (`DELETE /youtube/v3/channelSections`), quota cost: 50.

    Inputs: `on_behalf_of_content_owner`, `id` (required).

    YouTube answers without a body; the step returns its status.

    ### Upload channel banner (`upload_channel_banner`)

    YouTube: `youtube.channelBanners.insert` (`POST /youtube/v3/channelBanners/insert`), quota cost: 50.

    Inputs: `on_behalf_of_content_owner`, `on_behalf_of_content_owner_channel`, `channel_id`, `body`, `file` (required), `content_type`.

    Body (`body`, a ChannelBannerResource): `etag`, `kind`, `url`.

    File: `file`, sent by YouTube's resumable upload.

    Returns a ChannelBannerResource with `kind`, `url`, `etag`.

    ### Set channel watermark (`set_channel_watermark`)

    YouTube: `youtube.watermarks.set` (`POST /youtube/v3/watermarks/set`), quota cost: 50.

    Inputs: `channel_id` (required), `on_behalf_of_content_owner`, `body`, `file` (required), `content_type`.

    Body (`body`, a InvideoBranding): `imageBytes`, `imageUrl`, `position`, `targetChannelId`, `timing`.

    File: `file`, sent by YouTube's resumable upload.

    YouTube answers without a body; the step returns its status.

    ### Remove channel watermark (`remove_channel_watermark`)

    YouTube: `youtube.watermarks.unset` (`POST /youtube/v3/watermarks/unset`), quota cost: 50.

    Inputs: `on_behalf_of_content_owner`, `channel_id` (required).

    YouTube answers without a body; the step returns its status.

    ### Get channel activities (`get_channel_activities`)

    YouTube: `youtube.activities.list` (`GET /youtube/v3/activities`), quota cost: 1.

    Inputs: `published_before`, `part` (required), `mine`, `max_results`, `page_token`, `home`, `region_code`, `channel_id`, `published_after`, `all_pages`, `max_items`, `skip`.

    Returns a ActivityListResponse; each item of `items` is a Activity with `id`, `contentDetails`, `snippet`, `etag`, `kind`.

    ### Get channel members (`get_channel_members`)

    YouTube: `youtube.members.list` (`GET /youtube/v3/members`), quota cost: 1.

    Inputs: `max_results`, `filter_by_member_channel_id`, `mode`, `part` (required), `page_token`, `has_access_to_level`, `all_pages`, `max_items`, `skip`.

    Returns a MemberListResponse; each item of `items` is a Member with `snippet`, `etag`, `kind`.

    ### Get membership levels (`get_membership_levels`)

    YouTube: `youtube.membershipsLevels.list` (`GET /youtube/v3/membershipsLevels`), quota cost: 1.

    Inputs: `part` (required).

    Returns a MembershipsLevelListResponse; each item of `items` is a MembershipsLevel with `etag`, `kind`, `id`, `snippet`.

    ### Get third-party links (`get_third_party_links`)

    YouTube: `youtube.thirdPartyLinks.list` (`GET /youtube/v3/thirdPartyLinks`).

    Inputs: `external_channel_id`, `linking_token`, `type`, `part` (required).

    Returns a ThirdPartyLinkListResponse; each item of `items` is a ThirdPartyLink with `status`, `snippet`, `linkingToken`, `etag`, `kind`.

    ### Create third-party link (`create_third_party_link`)

    YouTube: `youtube.thirdPartyLinks.insert` (`POST /youtube/v3/thirdPartyLinks`).

    Inputs: `part` (required), `external_channel_id`, `body` (required).

    Body (`body`, a ThirdPartyLink): `etag`, `kind`, `linkingToken`, `snippet`, `status`.

    Returns a ThirdPartyLink with `status`, `snippet`, `linkingToken`, `etag`, `kind`.

    ### Update third-party link (`update_third_party_link`)

    YouTube: `youtube.thirdPartyLinks.update` (`PUT /youtube/v3/thirdPartyLinks`).

    Inputs: `external_channel_id`, `part` (required), `body` (required).

    Body (`body`, a ThirdPartyLink): `etag`, `kind`, `linkingToken`, `snippet`, `status`.

    Returns a ThirdPartyLink with `status`, `snippet`, `linkingToken`, `etag`, `kind`.

    ### Delete third-party link (`delete_third_party_link`)

    YouTube: `youtube.thirdPartyLinks.delete` (`DELETE /youtube/v3/thirdPartyLinks`).

    Inputs: `external_channel_id`, `linking_token` (required), `type` (required), `part`.

    YouTube answers without a body; the step returns its status.

    ## Videos

    ### Get my video ratings (`get_my_video_ratings`)

    YouTube: `youtube.videos.getRating` (`GET /youtube/v3/videos/getRating`), quota cost: 1.

    Inputs: `id` (required), `on_behalf_of_content_owner`.

    Returns a VideoGetRatingResponse; each item of `items` is a VideoRating with `videoId`, `rating`.

    ### Get video statistics batch (`get_video_statistics_batch`)

    YouTube: `youtube.videos.batchGetStats` (`GET /youtube/v3/videos:batchGetStats`).

    Inputs: `id`, `part`, `on_behalf_of_content_owner`.

    Returns a BatchGetStatsResponse; each item of `items` is a VideoStat with `kind`, `etag`, `statistics`, `snippet`, `contentDetails`, `id`.

    ### Get videos (`get_videos`)

    YouTube: `youtube.videos.list` (`GET /youtube/v3/videos`), quota cost: 1.

    Inputs: `video_category_id`, `locale`, `part` (required), `hl`, `max_results`, `region_code`, `on_behalf_of_content_owner`, `chart`, `max_height`, `my_rating`, `id`, `page_token`, `max_width`, `all_pages`, `max_items`, `skip`.

    Returns a VideoListResponse; each item of `items` is a Video with `kind`, `suggestions`, `status`, `snippet`, `liveStreamingDetails`, `statistics`, `brandPartner`, `player`, `contentDetails`, `projectDetails`, `processingDetails`, `localizations`, `etag`, `fileDetails`, `monetizationDetails`, `recordingDetails`, `topicDetails`, `paidProductPlacementDetails`, `ageGating`, `id`.

    ### Report video abuse (`report_video_abuse`)

    YouTube: `youtube.videos.reportAbuse` (`POST /youtube/v3/videos/reportAbuse`), quota cost: 50.

    Inputs: `on_behalf_of_content_owner`, `body` (required).

    Body (`body`, a VideoAbuseReport): `comments`, `language`, `reasonId`, `secondaryReasonId`, `videoId`.

    YouTube answers without a body; the step returns its status.

    ### Upload video file (`upload_video_file`)

    YouTube: `youtube.videos.insert` (`POST /youtube/v3/videos`), quota cost: 100 quota per day. Each call costs 1 quota..

    Inputs: `auto_levels`, `on_behalf_of_content_owner`, `notify_subscribers`, `on_behalf_of_content_owner_channel`, `part` (required), `stabilize`, `body`, `file` (required), `content_type`.

    Body (`body`, a Video): `ageGating`, `brandPartner`, `contentDetails`, `etag`, `fileDetails`, `id`, `kind`, `liveStreamingDetails`, `localizations`, `monetizationDetails`, `paidProductPlacementDetails`, `player`, `processingDetails`, `projectDetails`, `recordingDetails`, `snippet`, `statistics`, `status`, `suggestions`, `topicDetails`.

    File: `file`, sent by YouTube's resumable upload.

    Returns a Video with `kind`, `suggestions`, `status`, `snippet`, `liveStreamingDetails`, `statistics`, `brandPartner`, `player`, `contentDetails`, `projectDetails`, `processingDetails`, `localizations`, `etag`, `fileDetails`, `monetizationDetails`, `recordingDetails`, `topicDetails`, `paidProductPlacementDetails`, `ageGating`, `id`.

    ### Rate video (`rate_video`)

    YouTube: `youtube.videos.rate` (`POST /youtube/v3/videos/rate`), quota cost: 50.

    Inputs: `id` (required), `rating` (required).

    YouTube answers without a body; the step returns its status.

    ### Update video (`update_video`)

    YouTube: `youtube.videos.update` (`PUT /youtube/v3/videos`), quota cost: 50.

    Inputs: `part` (required), `on_behalf_of_content_owner`, `body` (required).

    Body (`body`, a Video): `ageGating`, `brandPartner`, `contentDetails`, `etag`, `fileDetails`, `id`, `kind`, `liveStreamingDetails`, `localizations`, `monetizationDetails`, `paidProductPlacementDetails`, `player`, `processingDetails`, `projectDetails`, `recordingDetails`, `snippet`, `statistics`, `status`, `suggestions`, `topicDetails`.

    Returns a Video with `kind`, `suggestions`, `status`, `snippet`, `liveStreamingDetails`, `statistics`, `brandPartner`, `player`, `contentDetails`, `projectDetails`, `processingDetails`, `localizations`, `etag`, `fileDetails`, `monetizationDetails`, `recordingDetails`, `topicDetails`, `paidProductPlacementDetails`, `ageGating`, `id`.

    ### Delete video (`delete_video`)

    YouTube: `youtube.videos.delete` (`DELETE /youtube/v3/videos`), quota cost: 50.

    Inputs: `on_behalf_of_content_owner`, `id` (required).

    YouTube answers without a body; the step returns its status.

    ### Get video trainability (`get_video_trainability`)

    YouTube: `youtube.videoTrainability.get` (`GET /youtube/v3/videoTrainability`).

    Inputs: `id`.

    Returns a VideoTrainability with `permitted`, `videoId`, `kind`, `etag`.

    ### Set video thumbnail file (`set_video_thumbnail_file`)

    YouTube: `youtube.thumbnails.set` (`POST /youtube/v3/thumbnails/set`), quota cost: 50.

    Inputs: `video_id` (required), `on_behalf_of_content_owner`, `file` (required), `content_type`.

    File: `file`, sent by YouTube's resumable upload.

    Returns a ThumbnailSetResponse; each item of `items` is a ThumbnailDetails with `standard`, `qhd`, `default`, `medium`, `uhd`, `high`, `maxres`, `fhd`, `shortsAspectRatio`.

    ### Search YouTube (`search_youtube`)

    YouTube: `youtube.search.list` (`GET /youtube/v3/search`), quota cost: 100 quota per day. Each call costs 1 quota..

    Inputs: `order`, `page_token`, `video_dimension`, `type`, `max_results`, `video_duration`, `video_syndicated`, `region_code`, `published_after`, `video_type`, `for_mine`, `for_content_owner`, `location`, `event_type`, `safe_search`, `video_category_id`, `channel_type`, `for_developer`, `part` (required), `video_embeddable`, `on_behalf_of_content_owner`, `channel_id`, `location_radius`, `video_license`, `video_caption`, `video_definition`, `published_before`, `video_paid_product_placement`, `q`, `relevance_language`, `topic_id`, `all_pages`, `max_items`, `skip`.

    Returns a SearchListResponse; each item of `items` is a SearchResult with `etag`, `kind`, `snippet`, `id`.

