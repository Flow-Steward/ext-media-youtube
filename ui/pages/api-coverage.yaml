    Inputs: `region_code`, `id`, `part` (required), `hl`.

    Returns a VideoCategoryListResponse; each item of `items` is a VideoCategory with `id`, `kind`, `etag`, `snippet`.

    ### Get abuse report reasons (`get_abuse_report_reasons`)

    YouTube: `youtube.videoAbuseReportReasons.list` (`GET /youtube/v3/videoAbuseReportReasons`), quota cost: 1.

    Inputs: `part` (required), `hl`.

