title: 'YouTube API: Channels'
description: The 16 channels steps.
components:
- component_id: steps_channels
  type: markdown
  title: Channels
  body: |
    ### Get channels

    Reads channels by ID, handle or username, or the channels of the connected account (mine). Calls youtube.channels.list (GET /youtube/v3/channels) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner, youtubepartner-channel-audit.

    Action id `get_channels` · reads only · YouTube: `GET /youtube/v3/channels`

    Inputs: `on_behalf_of_content_owner`, `my_subscribers`, `id`, `managed_by_me`, `for_username`, `max_results`, `mine`, `hl`, `category_id`, `part` (required), `page_token`, `for_handle`, `all_pages`, `max_items`, `skip`.

    ### Update channel

    Changes a channel's branding settings, localizations or status; the parts sent replace the current ones. Calls youtube.channels.update (PUT /youtube/v3/channels) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `update_channel` · changes data in YouTube · YouTube: `PUT /youtube/v3/channels`

    Inputs: `on_behalf_of_content_owner`, `part` (required), `body` (required).

    ### Get channel sections

    Reads the sections of a channel. Calls youtube.channelSections.list (GET /youtube/v3/channelSections) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.

    Action id `get_channel_sections` · reads only · YouTube: `GET /youtube/v3/channelSections`

    Inputs: `mine`, `on_behalf_of_content_owner`, `id`, `part` (required), `channel_id`, `hl`.

    ### Create channel section

    Adds a section to the connected channel. Calls youtube.channelSections.insert (POST /youtube/v3/channelSections) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `create_channel_section` · changes data in YouTube · YouTube: `POST /youtube/v3/channelSections`

    Inputs: `part` (required), `on_behalf_of_content_owner_channel`, `on_behalf_of_content_owner`, `body` (required).

    ### Update channel section

    Changes a section of the connected channel. Calls youtube.channelSections.update (PUT /youtube/v3/channelSections) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `update_channel_section` · changes data in YouTube · YouTube: `PUT /youtube/v3/channelSections`

    Inputs: `on_behalf_of_content_owner`, `part` (required), `body` (required).

    ### Delete channel section

    Removes a channel section. Calls youtube.channelSections.delete (DELETE /youtube/v3/channelSections) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `delete_channel_section` · changes data in YouTube · YouTube: `DELETE /youtube/v3/channelSections`

    Inputs: `on_behalf_of_content_owner`, `id` (required).

    ### Upload channel banner

    Uploads a banner image from a workflow file; set the URL it returns as the channel's banner with Update channel. Calls youtube.channelBanners.insert (POST /youtube/v3/channelBanners/insert) of the YouTube Data API. Quota cost: 50 units per call. The workflow file in file (required) is sent by YouTube's resumable upload, up to 6 MiB here (YouTube: 6 MiB). Google scopes: youtube, youtube.force-ssl, youtube.upload.

    Action id `upload_channel_banner` · changes data in YouTube · YouTube: `POST /youtube/v3/channelBanners/insert`

    Inputs: `on_behalf_of_content_owner`, `on_behalf_of_content_owner_channel`, `channel_id`, `body`, `file` (required), `content_type`.

    ### Set channel watermark

    Uploads a watermark image from a workflow file and sets it for a channel. YouTube: Allows upload of watermark image and setting it for a channel. Calls youtube.watermarks.set (POST /youtube/v3/watermarks/set) of the YouTube Data API. Quota cost: 50 units per call. The workflow file in file (required) is sent by YouTube's resumable upload, up to 10 MiB here (YouTube: 10 MiB). Google scopes: youtube, youtube.force-ssl, youtube.upload, youtubepartner.

    Action id `set_channel_watermark` · changes data in YouTube · YouTube: `POST /youtube/v3/watermarks/set`

    Inputs: `channel_id` (required), `on_behalf_of_content_owner`, `body`, `file` (required), `content_type`.

    ### Remove channel watermark

    Removes a channel's watermark. YouTube: Allows removal of channel watermark. Calls youtube.watermarks.unset (POST /youtube/v3/watermarks/unset) of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl, youtubepartner.

    Action id `remove_channel_watermark` · changes data in YouTube · YouTube: `POST /youtube/v3/watermarks/unset`

    Inputs: `on_behalf_of_content_owner`, `channel_id` (required).

    ### Get channel activities

    Reads the activities of a channel or of the connected account. Calls youtube.activities.list (GET /youtube/v3/activities) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly.

    Action id `get_channel_activities` · reads only · YouTube: `GET /youtube/v3/activities`

    Inputs: `published_before`, `part` (required), `mine`, `max_results`, `page_token`, `home`, `region_code`, `channel_id`, `published_after`, `all_pages`, `max_items`, `skip`.

    ### Get channel members

    Reads the members of the connected channel (channel memberships). YouTube: Retrieves a list of members that match the request criteria for a channel. Calls youtube.members.list (GET /youtube/v3/members) of the YouTube Data API. Quota cost: 1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page, up to max_items. Google scopes: youtube.channel-memberships.creator.

    Action id `get_channel_members` · reads only · YouTube: `GET /youtube/v3/members`

    Inputs: `max_results`, `filter_by_member_channel_id`, `mode`, `part` (required), `page_token`, `has_access_to_level`, `all_pages`, `max_items`, `skip`.

    ### Get membership levels

    Reads the membership levels the connected channel offers. YouTube: Retrieves a list of all pricing levels offered by a creator to the fans. Calls youtube.membershipsLevels.list (GET /youtube/v3/membershipsLevels) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube.channel-memberships.creator.

    Action id `get_membership_levels` · reads only · YouTube: `GET /youtube/v3/membershipsLevels`

    Inputs: `part` (required).

    ### Get third-party links

    Reads links between a channel and a store or affiliate program. Calls youtube.thirdPartyLinks.list (GET /youtube/v3/thirdPartyLinks) of the YouTube Data API. The YouTube quota table gives no cost for it. The source names no Google scope for it.

    Action id `get_third_party_links` · reads only · YouTube: `GET /youtube/v3/thirdPartyLinks`

    Inputs: `external_channel_id`, `linking_token`, `type`, `part` (required).

    ### Create third-party link

    Links a channel with a store or affiliate program. Calls youtube.thirdPartyLinks.insert (POST /youtube/v3/thirdPartyLinks) of the YouTube Data API. The YouTube quota table gives no cost for it. The source names no Google scope for it.

    Action id `create_third_party_link` · changes data in YouTube · YouTube: `POST /youtube/v3/thirdPartyLinks`

    Inputs: `part` (required), `external_channel_id`, `body` (required).

    ### Update third-party link

    Changes a link between a channel and a store or affiliate program. Calls youtube.thirdPartyLinks.update (PUT /youtube/v3/thirdPartyLinks) of the YouTube Data API. The YouTube quota table gives no cost for it. The source names no Google scope for it.

    Action id `update_third_party_link` · changes data in YouTube · YouTube: `PUT /youtube/v3/thirdPartyLinks`

    Inputs: `external_channel_id`, `part` (required), `body` (required).

    ### Delete third-party link

    Removes a link between a channel and a store or affiliate program. Calls youtube.thirdPartyLinks.delete (DELETE /youtube/v3/thirdPartyLinks) of the YouTube Data API. The YouTube quota table gives no cost for it. The source names no Google scope for it.

    Action id `delete_third_party_link` · changes data in YouTube · YouTube: `DELETE /youtube/v3/thirdPartyLinks`

    Inputs: `external_channel_id`, `linking_token` (required), `type` (required), `part`.
