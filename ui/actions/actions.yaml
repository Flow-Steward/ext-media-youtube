- action_id: get_subscriptions
  title: Get subscriptions
  description: 'Reads subscriptions by ID, of a channel, of the connected account or its subscribers.
    Calls youtube.subscriptions.list (GET /youtube/v3/subscriptions) of the YouTube Data API. Quota cost:
    1 unit per call. Returns one page in items with next_page_token; with all_pages it reads every page,
    up to max_items. Google scopes: youtube, youtube.force-ssl, youtube.readonly, youtubepartner.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: my_subscribers
    type: boolean
    required: false
  - name: on_behalf_of_content_owner
    type: string
    required: false
  - name: max_results
    type: integer
    required: false
  - name: my_recent_subscribers
    type: boolean
    required: false
  - name: id
    type: array
    required: false
  - name: page_token
    type: string
    required: false
  - name: channel_id
    type: string
    required: false
  - name: mine
    type: boolean
    required: false
  - name: for_channel_id
    type: string
    required: false
  - name: part
    type: array
    required: true
  - name: on_behalf_of_content_owner_channel
    type: string
    required: false
  - name: order
    type: string
    required: false
  - name: all_pages
    type: boolean
    required: false
  - name: max_items
    type: integer
    required: false
  - name: skip
    type: integer
    required: false
  result_fields:
  - status
  - data
  - items
  - count
  - complete
  - next_page_token
  - next_skip
  - etag
  - warnings
  error_codes: *id001
- action_id: create_subscription
  title: Create subscription
  description: 'Subscribes the connected account to a channel. Calls youtube.subscriptions.insert (POST
    /youtube/v3/subscriptions) of the YouTube Data API. Quota cost: 50 units per call. Google scopes:
    youtube, youtube.force-ssl, youtubepartner.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  command_type: invoke_extension_action
  mutates_platform: true
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: part
    type: array
    required: true
  - name: body
    type: object
    required: true
  result_fields:
  - status
  - data
  - processing
  - applied
  - check
  - etag
  - warnings
  - external_effect_status
  - definitely_no_external_effect
  error_codes: *id002
- action_id: delete_subscription
  title: Delete subscription
  description: 'Unsubscribes from a channel. Calls youtube.subscriptions.delete (DELETE /youtube/v3/subscriptions)
    of the YouTube Data API. Quota cost: 50 units per call. Google scopes: youtube, youtube.force-ssl,
    youtubepartner.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  command_type: invoke_extension_action
  mutates_platform: true
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: id
    type: string
    required: true
  result_fields:
  - status
  - data
  - processing
  - applied
  - check
  - etag
  - warnings
  - external_effect_status
  - definitely_no_external_effect
  error_codes: *id002
- action_id: get_interface_languages
  title: Get interface languages
  description: 'Reads the application languages YouTube supports. Calls youtube.i18nLanguages.list (GET
    /youtube/v3/i18nLanguages) of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube,
    youtube.force-ssl, youtube.readonly, youtubepartner.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: hl
    type: string
    required: false
  - name: part
    type: array
    required: true
  result_fields:
  - status
  - data
  - etag
  - warnings
  error_codes: *id001
- action_id: get_content_regions
  title: Get content regions
  description: 'Reads the content regions YouTube supports. Calls youtube.i18nRegions.list (GET /youtube/v3/i18nRegions)
    of the YouTube Data API. Quota cost: 1 unit per call. Google scopes: youtube, youtube.force-ssl, youtube.readonly,
    youtubepartner.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: part
    type: array
    required: true
  - name: hl
    type: string
    required: false
  result_fields:
  - status
  - data
  - etag
  - warnings
  error_codes: *id001
- action_id: verify_identity
  title: Verify YouTube channel
  description: 'Run by Flow Steward after a new authorization: reads the channel of the connected Google
    account (GET /youtube/v3/channels, mine) and returns its id and title.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: false
  parameters: []
