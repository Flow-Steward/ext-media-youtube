    workflow file) is full or time runs out; then complete is false and next_page_token says where to
    continue. Quota cost: 1 unit per page.'
  operation_kind: source
  category: media
  connection_type_ids:
  - youtube_channel
  - youtube_channel_monetized
  - youtube_content_owner
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: video_id
    value_type: text
    required: true
    schema:
      title: Video ID
      description: The YouTube video ID.
      type: string
      maxLength: 100
  - name: order
    value_type: text
    required: false
    schema:
      title: Order
      description: time (newest first) or relevance.
      type: string
      enum:
      - time
      - relevance
  - name: search_terms
    value_type: text
    required: false
    schema:
      title: Search
      description: Only comments containing these words.
      type: string
      maxLength: 500
  - name: text_format
    value_type: text
    required: false
    schema:
      title: Text format
      description: html (YouTube's default) or plainText.
      type: string
      enum:
      - html
      - plainText
  - name: include_replies
    value_type: boolean
    required: false
    schema:
      title: Include replies
      type: boolean
      description: Also return the replies YouTube includes in each thread (Get comments reads all replies
        of one comment).
  - name: max_comments
    value_type: integer
    required: false
    schema:
      title: Most comments
      type: integer
      minimum: 1
      maximum: 100000
      description: The most comment threads to read (default 10000).
  - name: page_token
    value_type: text
    required: false
    schema:
      title: Page token
      description: 'Start from this page: next_page_token of an earlier run that stopped early.'
      type: string
      maxLength: 1000
  - name: output
    value_type: text
    required: false
    schema:
      title: Output
      description: 'step (default): the records in the step output. file: a JSON workflow file, for long
        lists.'
      type: string
      enum: *id011
  outputs:
  - name: comments
    value_type: array
    schema:
      type: array
      items:
        type: object
        additionalProperties: true
      description: 'The comment threads read (empty with output file: they are in file).'
  - name: count
    value_type: integer
    schema:
      type: integer
      description: How many comment threads were read.
  - name: complete
    value_type: boolean
    schema:
      type: boolean
      description: True when all comment threads were read.
  - name: next_page_token
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: 'When complete is false: the page_token to start the next run from.'
  - name: file
    value_type: artifact_handle
    schema:
      type:
      - string
      - 'null'
      description: 'With output file: the comment threads as a JSON workflow file.'
  - name: warnings
    value_type: array
    schema:
      type: array
      items: *id001
      description: What the step could not do fully or what to check.
  result_fields:
  - result.comments
  - result.count
  - result.complete
  - result.next_page_token
  - result.file
  - result.warnings
  error_codes: *id002
