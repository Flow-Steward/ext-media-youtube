      type: string
      maxLength: 2000
  - name: sort
    value_type: text
    required: false
    schema:
      title: Sort
      description: Sort by these dimensions or metrics, - for descending, such as -views.
      type: string
      maxLength: 500
  - name: max_results
    value_type: integer
    required: false
    schema:
      title: Most rows
      type: integer
      minimum: 1
      maximum: 1000000
      description: The most rows to return.
  - name: currency
