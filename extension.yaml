extension_id: flowsteward.youtube
kind: tool_provider
version: 0.1.1
release_stage: active
billing_mode: free
display_name: YouTube
description: 'Connect workflows to your YouTube channel through the YouTube Data API
  v3. Everyday steps read your channels and all videos of a channel, read videos by
  ID, upload a video from a workflow file and follow its processing, change a video''s
  details and thumbnail, read all comments of a video and reply, and manage playlists.


  81 of the 83 methods of the API have their own step: channels, videos, playlists,
  comments, captions, live streaming and subscriptions, 94 steps in all. A connection
  is one YouTube channel, authorized through your own Google Cloud OAuth client. YouTube
  Analytics reports are in the separate extension YouTube Analytics (flowsteward.youtube-analytics).'
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-media-youtube/issues
  website_url: https://github.com/Flow-Steward/ext-media-youtube
listing:
  category: media
  tags:
  - youtube
  - video
  - upload
  - comments
  - playlists
  - captions
  summary: Upload and update YouTube videos, manage playlists, comments, captions
    and live streams.
  categories:
  - media
  - marketing
  setup_summary: Create a Web application OAuth client in Google Cloud with the YouTube
    Data API v3 enabled, enter its Client ID and Client Secret on the Connection page,
    connect the channel and run the connection test.
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_youtube
  required_scopes:
